[package]
name = "minarrow-pyo3"
version = "0.18.1"
edition = "2024"
authors = ['Peter G. Bower']
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pbower/minarrow"
documentation = "https://docs.rs/minarrow-pyo3/"
keywords = [
    "arrow",
    "apache-arrow",
    "pyo3",
    "python",
    "ffi",
]
categories = ["external-ffi-bindings", "api-bindings"]
description = "PyO3 bindings for MinArrow - zero-copy Arrow interop with Python via PyArrow"

[workspace]

[lib]
name = "minarrow_pyo3"
crate-type = ["cdylib", "rlib"]

[dependencies]
minarrow = { version = "0.18.1", path = "..", features = ["large_string"] }
pyo3 = { version = "0.29" }
thiserror = "2"

[features]
default = ["datetime", "extended_numeric_types", "decimal"]
extension-module = ["pyo3/extension-module"]
datetime = ["minarrow/datetime"]
extended_numeric_types = ["minarrow/extended_numeric_types"]
# Mirrors the core crate, using 8-bit key (256 max unique categorical values) instead of 32-bit
# for efficiency
default_categorical_8 = ["minarrow/default_categorical_8"]
# Enables 8, 16 and 64 byte categorical bit widths. When combined with default_categorical_8,
# the extra one added is the 32 byte (making the other feature unused).
extended_categorical = ["minarrow/extended_categorical"]
decimal = ["minarrow/decimal"]
table_metadata = ["minarrow/table_metadata"]
# N-dimensional tensor bridging with DLPack capsule interchange.
ndarray = ["minarrow/ndarray", "minarrow/dlpack", "minarrow/views", "minarrow/select"]

[build-dependencies]
pyo3-build-config = "0.29"

[[example]]
name = "pycapsule_exchange"
path = "examples/pycapsule_exchange.rs"

[[test]]
name = "atomic_tests"
harness = false

[[test]]
name = "python_roundtrip"
harness = false
